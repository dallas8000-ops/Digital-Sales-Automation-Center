name: Legitimacy CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  legitimacy-gates:
    runs-on: ubuntu-latest
    env:
      # CI-only, non-production value; settings refuse to boot with DEBUG off
      # unless DJANGO_SECRET_KEY is >= 50 chars and not the public default.
      DJANGO_SECRET_KEY: ci-only-not-a-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate

      - name: Django checks
        run: python manage.py check

      - name: Unit tests
        run: python manage.py test core

      - name: Legitimacy smoke tests
        env:
          ADMIN_API_KEY: ci-smoke-key
        run: python manage.py smoke_legitimacy
